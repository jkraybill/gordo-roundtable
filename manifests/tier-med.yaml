# Tier MED — Standard Review
# 3 models randomly selected from Gauge List B (Trusted Advisors)
# All BC:high per Gauge -- safe for sensitive context
# Est. cost: ~$0.50-2.00 depending on selection
# Use case: Normal review work, draft feedback, day-to-day use
#
# Pool (List B): claude-haiku-4.5, deepseek-v4-flash, deepseek-v4-pro, tencent-hy3,
#                gpt-5.4, gemini-3.1-pro, glm-5.2, qwen3.7-max, kimi-k3, kimi-k2.6, llama-4-maverick
#
# This manifest shows one example selection. Use `--tier med` flag
# for randomized selection from the pool.
# No max_tokens on any reviewer (S137): explicit caps made reasoning models burn
# the whole budget on reasoning and return zero content. Absence = natural limit.

record_id: tier-med
tier: med
round: 1

# Example selection (randomize in practice)
reviewers:
  - id: glm-5.2
    provider: openrouter
    model: z-ai/glm-5.2

  - id: gpt-5.4
    provider: openrouter
    model: openai/gpt-5.4

  - id: deepseek-pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro

