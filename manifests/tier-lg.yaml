# Tier LG — Thorough Review
# 2 from Gauge List A (Bilateral Partners) + 3 from List B (Trusted Advisors)
# All BC:high per Gauge -- safe for sensitive context
# Est. cost: ~$4-8
# Use case: Important decisions, architectural reviews, pre-ratification
#
# List A pool: claude-opus-5, claude-opus-4.8, claude-opus-4.7
# List B pool: claude-haiku-4.5, deepseek-v4-flash, deepseek-v4-pro, tencent-hy3,
#              gpt-5.4, gemini-3.1-pro, glm-5.2, qwen3.7-max, kimi-k2.6, llama-4-maverick
#
# This manifest shows one example selection. Use `--tier lg` flag
# for randomized selection from the pools.
# No max_tokens on any reviewer (S137): explicit caps made reasoning models burn
# the whole budget on reasoning and return zero content. Absence = natural limit.

record_id: tier-lg
tier: lg
round: 1

# Example selection (randomize in practice)
reviewers:
  # List A (Bilateral Partners)
  - id: opus-5
    provider: openrouter
    model: anthropic/claude-opus-5
    reasoning_effort: high

  - id: opus-4.8
    provider: openrouter
    model: anthropic/claude-opus-4-8
    reasoning_effort: high

  # List B (Trusted Advisors)
  - id: glm-5.2
    provider: openrouter
    model: z-ai/glm-5.2

  - id: deepseek-pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro

  - id: gemini-3.1-pro
    provider: openrouter
    model: google/gemini-3.1-pro-preview

