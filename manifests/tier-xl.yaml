# Tier XL — High-Stakes Review
# 2 from Gauge List A (Bilateral Partners) + 3 from List B (frontier-weighted)
# All BC:high per Gauge -- safe for sensitive context
# Est. cost: ~$6-12
# Use case: High-stakes decisions, external-facing content, pre-publication
#
# List A pool: claude-opus-5, claude-opus-4.8, claude-opus-4.7
# List B pool (weighted 2x): gpt-5.4, gemini-3.1-pro, qwen3.7-max; others 1x
#
# This manifest shows one example selection. Use `--tier xl` flag
# for randomized weighted selection from the pools.
# No max_tokens on any reviewer (S137): explicit caps made reasoning models burn
# the whole budget on reasoning and return zero content. Absence = natural limit.

record_id: tier-xl
tier: xl
round: 1

# Example selection (weighted random in practice)
reviewers:
  # List A (Bilateral Partners)
  - id: opus-5
    provider: openrouter
    model: anthropic/claude-opus-5
    reasoning_effort: high

  - id: opus-4.8
    provider: openrouter
    model: anthropic/claude-opus-4-8
    reasoning_effort: high

  # List B (Trusted Advisors - frontier weighted)
  - id: gpt-5.4
    provider: openrouter
    model: openai/gpt-5.4
    reasoning_effort: high

  - id: gemini-3.1-pro
    provider: openrouter
    model: google/gemini-3.1-pro-preview
    reasoning_effort: high

  - id: qwen3.7-max
    provider: openrouter
    model: qwen/qwen3.7-max
    reasoning_effort: high

